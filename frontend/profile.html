<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My profile | CivicEvents</title>
    <link rel="icon" type="image/svg+xml" href="assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <div id="app-header"></div>

    <main id="main" class="mx-auto max-w-3xl px-4 pt-10 sm:px-6">
        <p class="text-xs font-bold uppercase tracking-[0.16em] text-action">Account</p>
        <h1 class="mt-2 text-4xl font-extrabold tracking-tight sm:text-5xl">My profile</h1>

        <div id="load-state" class="mt-8" aria-live="polite"></div>

        <div id="content" class="hidden">
            <!-- Read-only facts -->
            <dl class="mt-8 grid gap-4 sm:grid-cols-2">
                <div class="rounded-2xl border border-line p-5"><dt class="text-xs font-bold uppercase tracking-wide text-muted">Role</dt><dd id="v-role" class="mt-1 text-lg font-extrabold capitalize"></dd></div>
                <div class="rounded-2xl border border-line p-5"><dt class="text-xs font-bold uppercase tracking-wide text-muted">Account status</dt><dd id="v-active" class="mt-1 text-lg font-extrabold"></dd></div>
            </dl>

            <form id="profile-form" class="mt-6 space-y-6 rounded-2xl border border-line bg-white p-6 shadow-card sm:p-8" novalidate>
                <h2 class="text-xl font-extrabold">Personal details</h2>
                <div id="form-error" role="alert" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800"></div>

                <div>
                    <label for="full_name" class="mb-2 block text-sm font-bold">Full name</label>
                    <input id="full_name" type="text" autocomplete="name" required class="w-full rounded-xl border border-line px-4 py-3.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="full_name-error">
                    <p id="full_name-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
                </div>
                <div>
                    <label for="email" class="mb-2 block text-sm font-bold">Email address</label>
                    <input id="email" type="email" autocomplete="email" required class="w-full rounded-xl border border-line px-4 py-3.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="email-error">
                    <p id="email-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
                </div>
                <p class="text-sm text-muted">Your role and account status can only be changed by an administrator.</p>

                <div class="flex justify-end gap-3 border-t border-line pt-6">
                    <button type="button" id="reset-btn" class="rounded-xl border border-line px-5 py-3 text-sm font-bold hover:bg-surface">Reset</button>
                    <button type="submit" id="save-btn" class="rounded-xl bg-action px-6 py-3 text-sm font-bold text-white shadow-glow hover:bg-action-dark disabled:opacity-70">Save changes</button>
                </div>
            </form>

            <section id="activity" class="mt-10 hidden" aria-labelledby="act-h">
                <h2 id="act-h" class="text-xl font-extrabold">Your activity</h2>
                <dl id="activity-cards" class="mt-4 grid gap-4 sm:grid-cols-3"></dl>
            </section>
        </div>
    </main>

    <div id="app-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/profile.js"></script>
</body>
</html>
