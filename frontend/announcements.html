<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Announcements | CivicEvents</title>
    <link rel="icon" type="image/svg+xml" href="assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <div id="app-header"></div>

    <main id="main" class="mx-auto max-w-4xl px-4 pt-10 sm:px-6">
        <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
                <p class="text-xs font-bold uppercase tracking-[0.16em] text-action">Stay informed</p>
                <h1 class="mt-2 text-4xl font-extrabold tracking-tight sm:text-5xl">Announcements</h1>
                <p class="mt-3 text-muted">Audio updates from your city. Press play to listen.</p>
            </div>
            <!-- Admin only: revealed by announcements.js -->
            <button id="new-btn" type="button" class="hidden rounded-xl bg-action px-5 py-3 text-sm font-bold text-white shadow-glow hover:bg-action-dark">+ New announcement</button>
        </div>

        <p id="result-count" class="mt-8 text-sm font-semibold text-muted" aria-live="polite"></p>
        <section id="list" class="mt-4 space-y-4" aria-label="Announcements"></section>
    </main>

    <!-- Admin: create / edit dialog -->
    <dialog id="ann-dialog" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl p-0 shadow-card backdrop:bg-navy/60" aria-labelledby="dlg-h">
        <form id="ann-form" class="space-y-5 p-6" novalidate>
            <h2 id="dlg-h" class="text-xl font-extrabold">New announcement</h2>
            <div id="form-error" role="alert" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800"></div>

            <div>
                <label for="a-title" class="mb-2 block text-sm font-bold">Title <span class="text-action" aria-hidden="true">*</span></label>
                <input id="a-title" type="text" required maxlength="150" class="w-full rounded-xl border border-line px-4 py-3 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="a-title-error">
                <p id="a-title-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>

            <div id="audio-field">
                <label for="a-audio" class="mb-2 block text-sm font-bold">Audio file <span class="text-action" aria-hidden="true">*</span></label>
                <p id="a-audio-help" class="mb-2 text-sm text-muted">MP3, WAV, M4A or OGG, up to 5 MB.</p>
                <input id="a-audio" type="file" accept=".mp3,.wav,.m4a,.ogg,audio/*" aria-describedby="a-audio-help a-audio-error"
                       class="block w-full cursor-pointer rounded-xl border border-line text-sm file:mr-4 file:cursor-pointer file:border-0 file:bg-navy file:px-4 file:py-3 file:text-sm file:font-bold file:text-white hover:file:bg-navy-800">
                <p id="a-audio-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>
            <p id="edit-note" class="hidden rounded-xl bg-surface px-4 py-3 text-sm text-muted">The audio file cannot be replaced after upload. Delete this announcement and create a new one to change it.</p>

            <label id="published-field" class="flex cursor-pointer items-center gap-2.5 text-sm font-semibold">
                <input id="a-published" type="checkbox" checked class="h-4 w-4 accent-action"> Publish immediately
            </label>

            <div id="progress-wrap" class="hidden">
                <div class="mb-1 flex justify-between text-xs font-bold text-muted"><span>Uploading…</span><span id="progress-text">0%</span></div>
                <div id="progress-bar" class="h-2 overflow-hidden rounded-full bg-line" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill" class="h-full w-0 rounded-full bg-action transition-all"></div></div>
            </div>

            <div class="flex justify-end gap-3 border-t border-line pt-5">
                <button type="button" id="dlg-cancel" class="rounded-xl border border-line px-5 py-3 text-sm font-bold hover:bg-surface">Cancel</button>
                <button type="submit" id="dlg-submit" class="rounded-xl bg-action px-5 py-3 text-sm font-bold text-white hover:bg-action-dark disabled:opacity-70">Create announcement</button>
            </div>
        </form>
    </dialog>

    <div id="app-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/announcements.js"></script>
</body>
</html>
