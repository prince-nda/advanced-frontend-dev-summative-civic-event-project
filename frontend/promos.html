<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promos | CivicEvents</title>
    <link rel="icon" type="image/svg+xml" href="assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <div id="app-header"></div>

    <main id="main" class="mx-auto max-w-7xl px-4 pt-10 sm:px-6">
        <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
                <p class="text-xs font-bold uppercase tracking-[0.16em] text-action">Watch &amp; discover</p>
                <h1 class="mt-2 text-4xl font-extrabold tracking-tight sm:text-5xl">Promos</h1>
                <p class="mt-3 text-muted">Short videos from around the city, with captions.</p>
            </div>
            <!-- Admin only: revealed by promos.js -->
            <button id="new-btn" type="button" class="hidden rounded-xl bg-action px-5 py-3 text-sm font-bold text-white shadow-glow hover:bg-action-dark">+ New promo</button>
        </div>

        <p id="result-count" class="mt-8 text-sm font-semibold text-muted" aria-live="polite"></p>
        <section id="grid" class="mt-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Promos"></section>
        <div id="state" class="hidden"></div>
        <nav id="pagination" class="mt-10 flex flex-wrap items-center justify-center gap-2" aria-label="Pagination"></nav>
    </main>

    <!-- Admin: create / edit dialog -->
    <dialog id="promo-dialog" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl p-0 shadow-card backdrop:bg-navy/60" aria-labelledby="dlg-h">
        <form id="promo-form" class="max-h-[85vh] space-y-5 overflow-y-auto p-6" novalidate>
            <h2 id="dlg-h" class="text-xl font-extrabold">New promo</h2>
            <div id="form-error" role="alert" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800"></div>

            <div>
                <label for="p-title" class="mb-2 block text-sm font-bold">Title <span class="text-action" aria-hidden="true">*</span></label>
                <input id="p-title" type="text" required maxlength="150" class="w-full rounded-xl border border-line px-4 py-3 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="p-title-error">
                <p id="p-title-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>
            <div>
                <label for="p-desc" class="mb-2 block text-sm font-bold">Description <span class="text-action" aria-hidden="true">*</span></label>
                <textarea id="p-desc" rows="3" class="w-full rounded-xl border border-line px-4 py-3 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="p-desc-error"></textarea>
                <p id="p-desc-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>
            <div>
                <label for="p-caption" class="mb-2 block text-sm font-bold">Caption text <span class="text-action" aria-hidden="true">*</span></label>
                <p id="p-caption-help" class="mb-2 text-sm text-muted">What is said in the video. It is shown as captions and as a transcript. Write one sentence at a time.</p>
                <textarea id="p-caption" rows="4" class="w-full rounded-xl border border-line px-4 py-3 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="p-caption-help p-caption-error"></textarea>
                <p id="p-caption-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>
            <div>
                <label for="p-video" class="mb-2 block text-sm font-bold">Video file <span id="video-req" class="text-action" aria-hidden="true">*</span></label>
                <p id="p-video-help" class="mb-2 text-sm text-muted">MP4, MOV, AVI or MKV, up to 8 MB. <span id="video-keep" class="hidden">Leave empty to keep the current video.</span></p>
                <input id="p-video" type="file" accept=".mp4,.mov,.avi,.mkv,video/*" aria-describedby="p-video-help p-video-error"
                       class="block w-full cursor-pointer rounded-xl border border-line text-sm file:mr-4 file:cursor-pointer file:border-0 file:bg-navy file:px-4 file:py-3 file:text-sm file:font-bold file:text-white hover:file:bg-navy-800">
                <p id="p-video-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>

            <div id="progress-wrap" class="hidden">
                <div class="mb-1 flex justify-between text-xs font-bold text-muted"><span>Uploading…</span><span id="progress-text">0%</span></div>
                <div id="progress-bar" class="h-2 overflow-hidden rounded-full bg-line" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill" class="h-full w-0 rounded-full bg-action transition-all"></div></div>
            </div>

            <div class="flex justify-end gap-3 border-t border-line pt-5">
                <button type="button" id="dlg-cancel" class="rounded-xl border border-line px-5 py-3 text-sm font-bold hover:bg-surface">Cancel</button>
                <button type="submit" id="dlg-submit" class="rounded-xl bg-action px-5 py-3 text-sm font-bold text-white hover:bg-action-dark disabled:opacity-70">Create promo</button>
            </div>
        </form>
    </dialog>

    <div id="app-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/promos.js"></script>
</body>
</html>
