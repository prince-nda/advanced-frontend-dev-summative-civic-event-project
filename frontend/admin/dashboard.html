<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | CivicEvents Admin</title>
    <link rel="icon" type="image/svg+xml" href="../assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <div id="app-header"></div>

    <div class="mx-auto flex max-w-7xl flex-col gap-6 px-4 pt-6 sm:px-6 lg:flex-row lg:gap-8 lg:pt-10">
        <aside id="admin-nav" class="lg:w-64 lg:shrink-0"></aside>
        <main id="main" class="min-w-0 flex-1">
            <p id="today" class="text-xs font-bold uppercase tracking-[0.16em] text-action"></p>
            <div class="mt-2 flex flex-wrap items-end justify-between gap-4">
                <div>
                    <h1 id="greeting" class="text-4xl font-extrabold tracking-tight sm:text-5xl">Dashboard</h1>
                    <p class="mt-2 text-muted">Here is what is happening across CivicEvents today.</p>
                </div>
                <div class="flex items-center gap-3">
                    <p id="updated" class="text-xs text-muted" aria-live="polite"></p>
                    <button id="refresh" type="button" class="rounded-xl border border-line px-4 py-2.5 text-sm font-bold hover:bg-surface disabled:opacity-60">Refresh</button>
                </div>
            </div>

            <div id="state" class="hidden"></div>
            <section id="stats" class="mt-8 grid grid-cols-2 gap-4 lg:grid-cols-4" aria-label="Key numbers"></section>

            <div class="mt-6 grid gap-6 xl:grid-cols-3">
                <section class="rounded-2xl border border-line bg-white p-6 shadow-card xl:col-span-2" aria-labelledby="chart-h">
                    <p class="text-xs font-bold uppercase tracking-[0.16em] text-action">Growth</p>
                    <h2 id="chart-h" class="mt-1 text-xl font-extrabold">New users per month</h2>
                    <div id="chart" class="mt-6"></div>
                </section>

                <div class="space-y-6">
                    <section class="rounded-2xl border border-line bg-white p-6 shadow-card" aria-labelledby="split-h">
                        <h2 id="split-h" class="text-xl font-extrabold">Events overview</h2>
                        <div id="split" class="mt-4"></div>
                    </section>
                    <section class="rounded-2xl border border-line bg-white p-6 shadow-card" aria-labelledby="qa-h">
                        <h2 id="qa-h" class="text-xl font-extrabold">Quick actions</h2>
                        <ul class="mt-3 divide-y divide-line text-sm font-bold">
                            <li><a class="flex items-center justify-between py-3 hover:text-action" href="../event-form.html">Create a new event <span aria-hidden="true">→</span></a></li>
                            <li><a class="flex items-center justify-between py-3 hover:text-action" href="../announcements.html">Publish an announcement <span aria-hidden="true">→</span></a></li>
                            <li><a class="flex items-center justify-between py-3 hover:text-action" href="../promos.html">Upload a promo <span aria-hidden="true">→</span></a></li>
                            <li><a class="flex items-center justify-between py-3 hover:text-action" href="users.html">Manage users <span aria-hidden="true">→</span></a></li>
                        </ul>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <div id="app-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script src="../js/pages/admin/dashboard.js"></script>
</body>
</html>
