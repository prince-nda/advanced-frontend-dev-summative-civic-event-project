<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications | CivicEvents Admin</title>
    <link rel="icon" type="image/svg+xml" href="../assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <div id="app-header"></div>

    <div class="mx-auto flex max-w-7xl flex-col gap-6 px-4 pt-6 sm:px-6 lg:flex-row lg:gap-8 lg:pt-10">
        <aside id="admin-nav" class="lg:w-64 lg:shrink-0"></aside>
        <main id="main" class="min-w-0 flex-1">
            <p class="text-xs font-bold uppercase tracking-[0.16em] text-action">Admin</p>
            <h1 class="mt-2 text-4xl font-extrabold tracking-tight sm:text-5xl">Notifications</h1>
            <p class="mt-3 text-muted">Notifications are created automatically when events, promos and announcements are added. You can delete any of them.</p>

            <div class="mt-8 max-w-xs">
                <label for="f-type" class="mb-1.5 block text-xs font-bold uppercase tracking-wide text-muted">Type</label>
                <select id="f-type" class="w-full rounded-xl border border-line bg-white px-3.5 py-2.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20"><option value="">All types</option></select>
            </div>

            <p id="result-count" class="mt-6 text-sm font-semibold text-muted" aria-live="polite"></p>
            <section id="list" class="mt-3 space-y-3" aria-label="Notifications"></section>
        </main>
    </div>

    <div id="app-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/admin-nav.js"></script>
    <script src="../js/pages/admin/notifications.js"></script>
</body>
</html>
