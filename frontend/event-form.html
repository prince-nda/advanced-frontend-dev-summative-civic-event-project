<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event form | CivicEvents</title>
    <link rel="icon" type="image/svg+xml" href="assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <div id="app-header"></div>

    <main id="main" class="mx-auto max-w-3xl px-4 pt-10 sm:px-6">
        <a href="events.html" class="text-sm font-bold text-action hover:underline">← Back to events</a>
        <p class="mt-6 text-xs font-bold uppercase tracking-[0.16em] text-action">Admin</p>
        <h1 id="form-title" class="mt-2 text-4xl font-extrabold tracking-tight">Create an event</h1>
        <p id="form-sub" class="mt-3 text-muted">Everyone gets a notification when a new event is published.</p>

        <div id="load-state" class="hidden"></div>

        <form id="event-form" class="mt-8 space-y-6 rounded-2xl border border-line bg-white p-6 shadow-card sm:p-8" novalidate>
            <div id="form-error" role="alert" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800"></div>

            <div>
                <label for="title" class="mb-2 block text-sm font-bold">Title <span class="text-action" aria-hidden="true">*</span></label>
                <input id="title" name="title" type="text" required maxlength="150" placeholder="e.g. City Sounds Festival"
                       class="w-full rounded-xl border border-line px-4 py-3.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="title-error">
                <p id="title-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>

            <div>
                <label for="description" class="mb-2 block text-sm font-bold">Description</label>
                <textarea id="description" name="description" rows="5" placeholder="What should people know about this event?"
                          class="w-full rounded-xl border border-line px-4 py-3.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20"></textarea>
            </div>

            <div>
                <label for="location" class="mb-2 block text-sm font-bold">Location <span class="text-action" aria-hidden="true">*</span></label>
                <input id="location" name="location" type="text" required placeholder="e.g. Kimironko Market, Kigali"
                       class="w-full rounded-xl border border-line px-4 py-3.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="location-error">
                <p id="location-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
            </div>

            <div class="grid gap-6 sm:grid-cols-2">
                <div>
                    <label for="starts_at" class="mb-2 block text-sm font-bold">Starts <span class="text-action" aria-hidden="true">*</span></label>
                    <input id="starts_at" name="starts_at" type="datetime-local" required
                           class="w-full rounded-xl border border-line px-4 py-3.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="starts_at-error">
                    <p class="mt-1.5 text-xs text-muted">Times are in Rwanda time (CAT, UTC+2).</p>
                    <p id="starts_at-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
                </div>
                <div>
                    <label for="ends_at" class="mb-2 block text-sm font-bold">Ends <span class="text-action" aria-hidden="true">*</span></label>
                    <input id="ends_at" name="ends_at" type="datetime-local" required
                           class="w-full rounded-xl border border-line px-4 py-3.5 text-sm outline-none focus:border-action focus:ring-4 focus:ring-brand/20" aria-describedby="ends_at-error">
                    <p id="ends_at-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
                </div>
            </div>

            <!-- Image upload with preview -->
            <div>
                <label for="image" class="mb-2 block text-sm font-bold">Event image</label>
                <p id="image-help" class="mb-3 text-sm text-muted">JPG, PNG or GIF, up to 2 MB.</p>
                <input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif"
                       class="block w-full cursor-pointer rounded-xl border border-line text-sm file:mr-4 file:cursor-pointer file:border-0 file:bg-navy file:px-4 file:py-3 file:text-sm file:font-bold file:text-white hover:file:bg-navy-800"
                       aria-describedby="image-help image-error">
                <p id="image-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>

                <figure id="preview-wrap" class="mt-4 hidden">
                    <img id="preview" src="" alt="Preview of the selected event image" class="max-h-96 w-full rounded-xl border border-line bg-surface object-contain">
                    <figcaption id="preview-caption" class="mt-2 text-xs text-muted"></figcaption>
                </figure>
            </div>

            <!-- Upload progress -->
            <div id="progress-wrap" class="hidden">
                <div class="mb-1 flex justify-between text-xs font-bold text-muted"><span>Uploading…</span><span id="progress-text">0%</span></div>
                <div class="h-2 overflow-hidden rounded-full bg-line" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
                    <div id="progress-fill" class="h-full w-0 rounded-full bg-action transition-all"></div>
                </div>
            </div>

            <div class="flex flex-wrap justify-end gap-3 border-t border-line pt-6">
                <a href="events.html" class="rounded-xl border border-line px-5 py-3 text-sm font-bold hover:bg-surface">Cancel</a>
                <button id="submit-btn" type="submit" class="rounded-xl bg-action px-6 py-3 text-sm font-bold text-white shadow-glow hover:bg-action-dark disabled:cursor-not-allowed disabled:opacity-70">Create event</button>
            </div>
        </form>
    </main>

    <div id="app-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/event-form.js"></script>
</body>
</html>
