<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My registrations | CivicEvents</title>
    <link rel="icon" type="image/svg+xml" href="assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <div id="app-header"></div>

    <main id="main" class="mx-auto max-w-4xl px-4 pt-10 sm:px-6">
        <p class="text-xs font-bold uppercase tracking-[0.16em] text-action">Your plans</p>
        <h1 class="mt-2 text-4xl font-extrabold tracking-tight sm:text-5xl">My registrations</h1>

        <div class="mt-8 flex flex-wrap gap-2" role="group" aria-label="Filter registrations">
            <button type="button" data-tab="upcoming" aria-pressed="true" class="tab rounded-full border px-4 py-2 text-sm font-bold">Upcoming</button>
            <button type="button" data-tab="past" aria-pressed="false" class="tab rounded-full border px-4 py-2 text-sm font-bold">Past</button>
            <button type="button" data-tab="cancelled" aria-pressed="false" class="tab rounded-full border px-4 py-2 text-sm font-bold">Cancelled</button>
        </div>

        <p id="result-count" class="mt-6 text-sm font-semibold text-muted" aria-live="polite"></p>
        <section id="list" class="mt-4 space-y-4" aria-label="Registrations"></section>
    </main>

    <div id="app-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/my-registrations.js"></script>
</body>
</html>
