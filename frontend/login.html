<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CivicEvents</title>
    <link rel="icon" type="image/svg+xml" href="assets/civicevents-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-white font-sans text-navy">
    <a href="#main" class="skip-link">Skip to sign in form</a>

    <div class="relative min-h-screen overflow-hidden bg-navy">
        <!-- Background photo + navy overlay (decorative) -->
        <img src="assets/auth-bg.jpg" alt="" class="absolute inset-0 h-full w-full object-cover" aria-hidden="true">
        <div class="absolute inset-0 bg-navy/85" aria-hidden="true"></div>
        <div class="absolute -right-32 top-16 h-96 w-96 rounded-full border border-white/10" aria-hidden="true"></div>
        <div class="absolute -bottom-24 -left-24 h-80 w-80 rounded-full border border-white/10" aria-hidden="true"></div>

        <header class="relative z-10 flex items-center justify-between px-6 py-6 sm:px-10">
            <a href="index.html" class="flex items-center gap-2.5 text-white" aria-label="CivicEvents home">
                <img src="assets/civicevents-icon.svg" alt="" class="h-9 w-9 rounded-lg bg-white p-1">
                <span class="text-xl font-bold">CivicEvents</span>
            </a>
            <a href="index.html" class="flex h-11 w-11 items-center justify-center rounded-full border border-white/40 text-xl text-white hover:bg-white/10" aria-label="Close and go back to the home page">✕</a>
        </header>

        <main id="main" class="relative z-10 flex items-center justify-center px-4 pb-14 pt-2">
            <div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl sm:p-10">
                <a href="index.html" class="mb-6 flex justify-center" aria-label="CivicEvents home"><img src="assets/civicevents-primary-logo.svg" alt="CivicEvents" class="h-9 w-auto"></a>

                <p class="text-center text-xs font-bold uppercase tracking-[0.16em] text-action">Welcome back</p>
                <h1 class="mt-2 text-center text-3xl font-extrabold tracking-tight sm:text-4xl">Sign in to your city</h1>
                <p class="mt-3 text-center text-sm text-muted">Your community is waiting. Let's get you back in.</p>

                <form id="login-form" class="mt-8 space-y-5" novalidate>
                    <div id="form-error" role="alert" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800"></div>

                    <div>
                        <label for="email" class="mb-2 block text-sm font-bold">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"
                               class="w-full rounded-xl border border-line bg-white px-4 py-3.5 text-sm outline-none transition placeholder:text-muted/70 focus:border-action focus:ring-4 focus:ring-brand/20"
                               aria-describedby="email-error">
                        <p id="email-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
                    </div>

                    <div>
                        <label for="password" class="mb-2 block text-sm font-bold">Password</label>
                        <div class="relative">
                            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"
                                   class="w-full rounded-xl border border-line bg-white py-3.5 pl-4 pr-20 text-sm outline-none transition placeholder:text-muted/70 focus:border-action focus:ring-4 focus:ring-brand/20"
                                   aria-describedby="password-error">
                            <button type="button" id="toggle-password" aria-controls="password" aria-pressed="false"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 rounded px-2 py-1 text-xs font-bold text-action hover:text-action-dark">Show</button>
                        </div>
                        <p id="password-error" class="mt-1.5 hidden text-sm font-medium text-red-700"></p>
                    </div>

                    <label class="flex cursor-pointer items-center gap-2.5 text-sm text-muted">
                        <input id="remember" type="checkbox" class="h-4 w-4 rounded border-line accent-action">
                        <span>Remember me on this device</span>
                    </label>

                    <button id="submit-btn" type="submit"
                            class="flex w-full items-center justify-center gap-2 rounded-xl bg-action px-6 py-4 text-sm font-bold text-white shadow-glow transition hover:bg-action-dark disabled:cursor-not-allowed disabled:opacity-70">
                        <span>Sign in</span><span aria-hidden="true">→</span>
                    </button>
                </form>

                <p class="mt-8 text-center text-sm text-muted">New to CivicEvents?
                    <a href="signup.html" class="font-bold text-action underline-offset-4 hover:underline">Create an account</a>
                </p>
            </div>
        </main>
    </div>


    <!-- Welcome dialog shown after a successful sign in -->
    <dialog id="welcome-dialog" class="w-[calc(100%-2rem)] max-w-md rounded-3xl p-0 shadow-card backdrop:bg-navy/70" aria-labelledby="wd-h">
        <div class="p-8 text-center">
            <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-action text-3xl font-bold text-white" aria-hidden="true">✓</span>
            <h2 id="wd-h" class="mt-6 text-3xl font-extrabold tracking-tight"></h2>
            <p class="mt-2 text-sm text-muted">You're signed in and ready to explore your city.</p>
            <a id="wd-go" href="#" class="mt-7 flex w-full items-center justify-center gap-2 rounded-xl bg-action px-6 py-4 text-sm font-bold text-white shadow-glow hover:bg-action-dark"></a>
        </div>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
